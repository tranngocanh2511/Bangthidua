<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dino Park - Thám Hiểm Cổ Đại</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --dino-green: #6ab04c;
            --lime-green: #badc58;
            --earth-orange: #f0932b;
            --egg-yellow: #ffbe76;
            --deep-brown: #30336b;
            --bg-jungle: #e8f5e9;
            --white: #ffffff;
        }

        * { box-sizing: border-box; font-family: 'Nunito', sans-serif; margin: 0; padding: 0; }

        body {
            background: linear-gradient(135deg, #d4edda, #c8e6c9);
            background-attachment: fixed; color: var(--deep-brown);
            overflow-x: hidden; touch-action: manipulation; min-height: 100vh;
        }

        body::before {
            content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: radial-gradient(var(--lime-green) 15%, transparent 16%),
                              radial-gradient(var(--egg-yellow) 15%, transparent 16%);
            background-size: 60px 60px; background-position: 0 0, 30px 30px;
            opacity: 0.15; z-index: -1;
        }

        header {
            background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px);
            padding: 15px 30px; display: flex; justify-content: space-between;
            align-items: center; border-bottom: 4px solid var(--dino-green);
            border-radius: 0 0 30px 30px; position: sticky; top: 0; z-index: 100;
            box-shadow: 0 6px 20px rgba(106, 176, 76, 0.2);
        }

        .stats-group { display: flex; gap: 20px; align-items: center; }

        .stat-item {
            font-weight: 900; font-size: 1.1rem; display: flex; align-items: center; gap: 8px;
            background: var(--egg-yellow); padding: 6px 16px; border-radius: 20px;
            border: 3px solid var(--earth-orange); color: var(--deep-brown);
            box-shadow: 0 4px 0 var(--earth-orange);
        }

        .xp-container {
            width: 140px; height: 18px; background: #fff; border-radius: 10px;
            overflow: hidden; border: 3px solid var(--dino-green);
        }

        #xp-bar {
            height: 100%; width: 0%; background: linear-gradient(90deg, var(--lime-green), var(--dino-green));
            transition: width 0.3s ease;
        }

        .game-container {
            display: grid; grid-template-columns: 1fr 1.5fr; gap: 30px;
            padding: 30px; max-width: 1200px; margin: 0 auto;
        }

        .hint-card {
            background: rgba(255, 255, 255, 0.92); padding: 25px; border-radius: 35px;
            border: 5px solid var(--dino-green); box-shadow: 0 10px 30px rgba(48, 51, 107, 0.15);
            display: flex; flex-direction: column; gap: 20px;
        }

        .hint-image-box {
            width: 100%; aspect-ratio: 16/9; background: #f1f8e9; border-radius: 20px;
            overflow: hidden; border: 4px solid var(--lime-green);
            box-shadow: inset 0 0 15px rgba(0,0,0,0.1);
        }

        .hint-image-box img { width: 100%; height: 100%; object-fit: cover; }

        .preview-box {
            background: #f9fbe7; padding: 20px; border-radius: 20px;
            border: 3px dashed var(--earth-orange); min-height: 150px;
            line-height: 1.8; font-size: 1.1rem; color: var(--deep-brown);
        }

        .preview-sentence {
            display: inline; margin-right: 5px; transition: all 0.5s; font-weight: 800;
        }

        .preview-sentence.hidden {
            color: transparent; background: rgba(240, 147, 43, 0.2);
            border-radius: 8px; user-select: none; filter: blur(4px);
        }

        .play-area { display: flex; flex-direction: column; gap: 25px; }

        .drop-zones { display: flex; flex-direction: column; gap: 15px; }

        .drop-zone {
            background: rgba(255, 255, 255, 0.7); border-radius: 25px; min-height: 65px;
            display: flex; align-items: center; padding: 10px 20px 10px 65px;
            position: relative; border: 3px dashed var(--dino-green);
        }

        .drop-zone::before {
            content: attr(data-index); position: absolute; left: 12px; top: 50%;
            transform: translateY(-50%); background: var(--earth-orange); color: white;
            width: 38px; height: 38px; border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            display: flex; justify-content: center; align-items: center;
            font-weight: 900; font-size: 1.1rem; border: 2px solid var(--deep-brown);
            box-shadow: 0 3px 0 var(--deep-brown);
        }

        .card-pool {
            background: rgba(255, 255, 255, 0.85); padding: 25px; border-radius: 35px;
            border: 5px solid var(--earth-orange); box-shadow: 0 10px 30px rgba(240, 147, 43, 0.2);
            display: flex; flex-wrap: wrap; gap: 15px; min-height: 180px; align-content: flex-start;
        }

        .sentence-card {
            background: var(--egg-yellow); color: var(--deep-brown); padding: 14px 22px;
            border-radius: 20px; font-weight: 900; cursor: grab; user-select: none;
            border: 3px solid var(--earth-orange); box-shadow: 0 6px 0 var(--earth-orange);
            position: relative; transition: transform 0.1s, box-shadow 0.1s;
        }

        .sentence-card:active {
            cursor: grabbing; transform: translateY(4px); box-shadow: 0 2px 0 var(--earth-orange);
        }

        .sentence-card.dragging { opacity: 0.5; }

        .sentence-card.correct {
            background: var(--lime-green); color: var(--deep-brown);
            border-color: var(--dino-green); box-shadow: 0 6px 0 var(--dino-green); cursor: default;
        }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(48, 51, 107, 0.7); backdrop-filter: blur(5px);
            display: flex; justify-content: center; align-items: center;
            z-index: 1000; visibility: hidden; opacity: 0; transition: 0.3s;
        }

        .modal-overlay.active { visibility: visible; opacity: 1; }

        .modal-content {
            background: var(--white); padding: 40px; border-radius: 40px;
            width: 90%; max-width: 550px; border: 6px solid var(--dino-green);
            box-shadow: 0 15px 0 var(--earth-orange); position: relative;
            max-height: 90vh; overflow-y: auto; text-align: center;
        }

        h2 {
            margin-bottom: 20px; color: var(--dino-green); font-size: 2.2rem;
            font-weight: 900; text-transform: uppercase;
        }

        .btn-primary {
            background: var(--dino-green); color: white; border: 3px solid var(--deep-brown);
            padding: 15px 30px; border-radius: 25px; font-weight: 900; font-size: 1.2rem;
            cursor: pointer; width: 100%; box-shadow: 0 6px 0 var(--deep-brown);
            margin-top: 10px; text-transform: uppercase; transition: all 0.1s;
        }

        .btn-primary:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--deep-brown); }

        .final-summary {
            background: #f1f8e9; padding: 20px; border-radius: 20px;
            margin: 20px 0; border: 3px dashed var(--dino-green);
        }

        .leaderboard { margin-top: 20px; text-align: left; max-height: 250px; overflow-y: auto; }

        .leaderboard-item {
            display: flex; justify-content: space-between; padding: 10px 15px;
            background: #f9fbe7; margin-bottom: 8px; border-radius: 12px;
            border: 2px solid var(--lime-green); font-weight: 800; color: var(--deep-brown);
        }

        .form-group { margin-bottom: 20px; text-align: left; }
        input[type="text"] {
            width: 100%; padding: 15px; border-radius: 20px; background: #f1f8e9;
            border: 3px solid var(--lime-green); color: var(--deep-brown);
            font-size: 1.1rem; outline: none; font-weight: 800;
        }

        @keyframes dinoStomp {
            0% { transform: translate(0, 0) rotate(0deg); }
            20% { transform: translate(-12px, 5deg); }
            40% { transform: translate(12px, -5deg); }
            60% { transform: translate(-8px, 3deg); }
            80% { transform: translate(8px, -2deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }
        .shake { animation: dinoStomp 0.4s ease-in-out; }

        @media (max-width: 850px) { .game-container { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <header>
        <div class="stats-group">
            <div class="stat-item">🦕 LVL <span id="lvl-badge">1</span></div>
            
        </div>
        <div class="stats-group">
            <div class="stat-item">⏱️ <span id="timer">00:00</span></div>
            <div class="stat-item">🦴 <span id="score">0</span></div>
            <div class="stat-item">🔥 <span id="combo">0</span></div>
        </div>
    </header>

    <main class="game-container">
        <section class="hint-card">
            <div class="hint-image-box">
                <!-- Tải ảnh hinh01.jpg từ thư mục máy tính -->
                <img id="hint-img" src="./hinh01.jpg" alt="Hóa thạch khủng long">
            </div>
            <div class="preview-box" id="preview-text"></div>
        </section>

        <section class="play-area">
            <div class="drop-zones" id="drop-zones"></div>
            <div class="card-pool" id="card-pool"></div>
        </section>
    </main>

    <!-- Màn hình chào mừng (Bắt buộc để kích hoạt âm thanh trên trình duyệt) -->
    <div id="modal-start" class="modal-overlay active">
        <div class="modal-content">
            <h2>CÔNG VIÊN KHỦNG LONG 🦖</h2>
            <p style="font-weight: 800; margin-bottom: 20px; font-size: 1.1rem;">Sắp xếp các mảnh hóa thạch để khôi phục câu chuyện cổ đại!</p>
            <button class="btn-primary" onclick="startGame()">BẮT ĐẦU CHƠI 🌋</button>
        </div>
    </div>

    <!-- Màn hình Chiến thắng -->
    <div id="modal-victory" class="modal-overlay">
        <div class="modal-content">
            <h2>HOÀN THÀNH KHAI QUẬT! 🦕🎉</h2>
            <div class="final-summary">
                <img id="final-img" src="./hinh01.jpg" style="width:100%; border-radius:15px; margin-bottom:15px; border:3px solid var(--dino-green);">
                <p id="final-text" style="font-weight:800; line-height:1.6; color:var(--deep-brown);"></p>
            </div>

            <div class="form-group">
                <input type="text" id="player-name" placeholder="Tên nhà khảo cổ học...">
                <button class="btn-primary" onclick="saveScore()">LƯU ĐIỂM SỐ</button>
            </div>
            <div class="leaderboard" id="leaderboard"></div>
            <button class="btn-primary" style="background:var(--earth-orange);" onclick="location.reload()">CHƠI LẠI TỪ ĐẦU 🏕️</button>
        </div>
    </div>

    <script>
        // DÁN URL GOOGLE SHEETS VÀO ĐÂY NẾU BẠN VẪN MUỐN DÙNG BẢNG XẾP HẠNG
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzALpG3FfnI7va--Fp5om9NZNQENW7pD5fT_vzi0iJptHp8SZCmWZBGBYD_P3exbCTi/exec";

        // KẾT NỐI ÂM THANH LOCAL
        const bgMusic = new Audio('./nhacnen.mp3');
        bgMusic.loop = true; // Lặp lại nhạc nền
        bgMusic.volume = 0.2; // Chỉnh âm lượng nhạc nền hơi nhỏ lại

        const correctSound = new Audio('./dung.mp3');
        const wrongSound = new Audio('./sai.mp3');
        const winSound = new Audio('./thang.mp3');

        // NỘI DUNG VĂN BẢN (Cố định trong code)
        const gameText = "Chú khủng long bạo chúa đang dạo bước qua thung lũng xanh mướt. Ánh nắng vàng rọi xuống những chiếc vảy khổng lồ của nó.";

        let gameState = {
            originalSentences: [], shuffledSentences: [],
            currentIndex: 0, score: 0, combo: 0, xp: 0,
            startTime: null, timerInterval: null
        };

       function startGame() {
    document.getElementById('modal-start').classList.remove('active');
    
    // 1. Phát nhạc nền
    bgMusic.play().catch(e => console.log("Trình duyệt chặn autoplay"));

    // 2. THỦ THUẬT CHO MOBILE: "Đánh thức" tất cả âm thanh hiệu ứng ngay khi bấm nút
    let sounds = [correctSound, wrongSound, winSound];
    sounds.forEach(sound => {
        sound.volume = 0; // Tạm tắt tiếng để không phát ra loa lúc này
        let playPromise = sound.play();
        if (playPromise !== undefined) {
            playPromise.then(_ => {
                sound.pause();
                sound.currentTime = 0;
                sound.volume = 1; // Mở lại âm lượng bình thường (1.0 = 100%)
            }).catch(error => {
                console.log("Lỗi đánh thức âm thanh trên mobile:", error);
            });
        }
    });

    // 3. Khởi tạo dữ liệu trò chơi
    gameState.originalSentences = gameText.match(/[^.!?]+[.!?]+/g) || [gameText];
    gameState.originalSentences = gameState.originalSentences.map(s => s.trim());
    gameState.shuffledSentences = [...gameState.originalSentences]
        .map((content, id) => ({ content, id }))
        .sort(() => Math.random() - 0.5);

    gameState.currentIndex = 0; gameState.score = 0; gameState.combo = 0; gameState.xp = 0;
    updateStats(); renderGame();
    
    clearInterval(gameState.timerInterval);
    gameState.startTime = Date.now();
    gameState.timerInterval = setInterval(updateTimer, 1000);
}

        function renderGame() {
            const previewBox = document.getElementById('preview-text');
            const dropZones = document.getElementById('drop-zones');
            const cardPool = document.getElementById('card-pool');

            previewBox.innerHTML = ''; dropZones.innerHTML = ''; cardPool.innerHTML = '';

            gameState.originalSentences.forEach((s, i) => {
                const span = document.createElement('span');
                span.className = 'preview-sentence hidden';
                span.id = `preview-${i}`; span.textContent = s + ' ';
                previewBox.appendChild(span);
            });

            gameState.originalSentences.forEach((_, i) => {
                const zone = document.createElement('div');
                zone.className = 'drop-zone'; zone.dataset.index = i + 1; zone.id = `zone-${i}`;
                zone.ondragover = e => e.preventDefault();
                zone.ondrop = handleDrop;
                dropZones.appendChild(zone);
            });

            gameState.shuffledSentences.forEach((item) => {
                const card = document.createElement('div');
                card.className = 'sentence-card'; card.textContent = item.content;
                card.draggable = true; card.dataset.id = item.id;
                
                card.ondragstart = e => {
                    e.target.classList.add('dragging');
                    e.dataTransfer.setData('text/plain', item.id);
                };
                card.ondragend = e => e.target.classList.remove('dragging');
                card.ontouchstart = handleTouchStart;
                cardPool.appendChild(card);
            });
        }

        function handleDrop(e) {
            e.preventDefault();
            const sentenceId = parseInt(e.dataTransfer.getData('text/plain'));
            const zoneIndex = parseInt(this.id.split('-')[1]);
            checkMatch(sentenceId, zoneIndex);
        }

        function checkMatch(sentenceId, zoneIndex) {
            if (sentenceId === zoneIndex && sentenceId === gameState.currentIndex) {
                const card = document.querySelector(`.sentence-card[data-id="${sentenceId}"]`);
                const zone = document.getElementById(`zone-${zoneIndex}`);
                
                zone.appendChild(card);
                card.draggable = false;
                card.classList.add('correct');
                
                document.getElementById(`preview-${sentenceId}`).classList.remove('hidden');
                
                gameState.combo++; gameState.score += 10 * gameState.combo; gameState.xp += 20;
                gameState.currentIndex++;
                updateStats();
                
                // Phát tiếng Đúng
                correctSound.currentTime = 0;
                correctSound.play();

                if (gameState.currentIndex === gameState.originalSentences.length) endGame();
            } else {
                gameState.combo = 0; updateStats();
                
                // Phát tiếng Sai và rung màn hình
                wrongSound.currentTime = 0;
                wrongSound.play();
                document.body.classList.add('shake');
                setTimeout(() => document.body.classList.remove('shake'), 400);
            }
        }

        let touchedCard = null;
        function handleTouchStart(e) {
            touchedCard = this;
            const touchMove = (e) => {
                e.preventDefault();
                const touch = e.touches[0];
                touchedCard.style.position = 'fixed';
                touchedCard.style.left = (touch.clientX - 50) + 'px';
                touchedCard.style.top = (touch.clientY - 20) + 'px';
                touchedCard.style.zIndex = 1000;
            };
            const touchEnd = (e) => {
                touchedCard.style.position = 'static';
                touchedCard.style.zIndex = 'auto';
                const touch = e.changedTouches[0];
                const dropTarget = document.elementFromPoint(touch.clientX, touch.clientY);
                const zone = dropTarget?.closest('.drop-zone');
                
                if (zone) {
                    const zoneIndex = parseInt(zone.id.split('-')[1]);
                    const sentenceId = parseInt(touchedCard.dataset.id);
                    checkMatch(sentenceId, zoneIndex);
                }
                window.removeEventListener('touchmove', touchMove);
                window.removeEventListener('touchend', touchEnd);
            };
            window.addEventListener('touchmove', touchMove, { passive: false });
            window.addEventListener('touchend', touchEnd);
        }

        function updateStats() {
            document.getElementById('score').textContent = gameState.score;
            document.getElementById('combo').textContent = gameState.combo;
            const lvl = Math.floor(gameState.xp / 100) + 1;
            const xpInLevel = gameState.xp % 100;
            document.getElementById('lvl-badge').textContent = lvl;
            
        }

        function updateTimer() {
            const diff = Math.floor((Date.now() - gameState.startTime) / 1000);
            const m = Math.floor(diff / 60).toString().padStart(2, '0');
            const s = (diff % 60).toString().padStart(2, '0');
            document.getElementById('timer').textContent = `${m}:${s}`;
        }

        function endGame() {
            clearInterval(gameState.timerInterval);
            
            // Dừng nhạc nền, phát nhạc chiến thắng
            bgMusic.pause();
            winSound.currentTime = 0;
            winSound.play();

            confetti({ particleCount: 180, spread: 90, origin: { y: 0.6 }, colors: ['#6ab04c', '#badc58', '#f0932b', '#ffbe76'] });

            const victoryModal = document.getElementById('modal-victory');
            document.getElementById('final-text').textContent = gameText;
            victoryModal.classList.add('active');
            showLeaderboard();
        }

        function saveScore() {
            const nameInput = document.getElementById('player-name');
            const name = nameInput.value || "Nhà khảo cổ ẩn danh";
            const btn = document.querySelector('.btn-primary[onclick="saveScore()"]');
            
            btn.textContent = "ĐANG LƯU...";
            btn.disabled = true; nameInput.disabled = true;

            const formData = new FormData();
            formData.append('name', name);
            formData.append('score', gameState.score);

            fetch(GOOGLE_SCRIPT_URL, { method: 'POST', body: formData })
            .then(response => response.text())
            .then(result => { btn.textContent = "ĐÃ LƯU THÀNH CÔNG!"; showLeaderboard(); })
            .catch(error => {
                console.error('Lỗi khi lưu điểm:', error);
                btn.textContent = "LỖI LƯU ĐIỂM (BẤM THỬ LẠI)";
                btn.disabled = false; nameInput.disabled = false;
            });
        }

        function showLeaderboard() {
            const board = document.getElementById('leaderboard');
            board.innerHTML = '<h3 style="color:var(--deep-brown); margin-bottom:10px;">Đang tải Bảng Vàng... ⏳</h3>';

            fetch(GOOGLE_SCRIPT_URL)
            .then(response => response.json())
            .then(data => {
                board.innerHTML = '<h3 style="color:var(--deep-brown); margin-bottom:10px;">🏆 Top Nhà Khảo Cổ (Live):</h3>';
                if(data.length === 0) { board.innerHTML += '<p>Chưa có nhà khảo cổ nào ghi danh.</p>'; return; }
                data.forEach((entry, i) => {
                    const date = new Date(entry.timestamp);
                    const timeStr = date.toLocaleTimeString('vi-VN', {hour: '2-digit', minute:'2-digit'});
                    board.innerHTML += `
                        <div class="leaderboard-item">
                            <span>${i+1}. ${entry.name} <small style="color:#666; font-size:0.8em;">(${timeStr})</small></span>
                            <span><b>${entry.score}</b> 🦴</span>
                        </div>
                    `;
                });
            })
            .catch(error => { board.innerHTML = '<h3 style="color:var(--earth-orange);">Không thể tải Bảng Vàng lúc này.</h3>'; });
        }
    </script>
</body>
</html>
